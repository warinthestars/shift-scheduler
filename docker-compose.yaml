# ------------------------------------------------------------------------------
# Phase 35.1.1: settings live in THREE files (each has a .template next to it):
#   .env                          ordinary settings, NO secrets (ports, names, providers, URLs, switches)
#   .secrets/stack.env            stack secrets: database / Redis passwords, login signing key,
#                                 super-admin password, tunnel token
#   .secrets/integrations.env     outside-service keys: email, texts, push, file storage
# Who gets what:
#   database, redis, cloudflared  -> .secrets/stack.env only (never the integration keys)
#   backend                       -> all three
#   frontend                      -> nothing
# ${...} below is only used for NON-secret values from .env. Secrets are never put in
# ${...}: Compose would read them from .env only, which is how secrets ended up there before.
# .secrets/ also holds the Firebase files and is mounted read-only into the backend.
#
# Phase 35.4: several stacks can run on one computer (for example dev and prod).
#   * No service has a fixed container name. Compose names each container
#     <stack name>-<service>-1 and puts the stack name in front of the network and the
#     volumes, so two stacks never share a container, a network or a database volume.
#   * The stack name is COMPOSE_PROJECT_NAME in .env. Not set = the name of this folder.
#   * Every port on your computer comes from .env. Each stack needs its own.
#   Never give a service a fixed container name again, and never write a fixed number on the
#   left side of a "ports:" line. See docs/DEPLOYMENT.md, section E.
# ------------------------------------------------------------------------------

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Relational Database
  # ----------------------------------------------------------------------------
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_PASSWORD comes from .secrets/stack.env. Don't add it under environment: (that would win and be blank).
    env_file:
      - path: ./.secrets/stack.env
        required: true
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-shiftboard_user}
      - POSTGRES_DB=${POSTGRES_DB:-shiftboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shiftboard_user} -d ${POSTGRES_DB:-shiftboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shiftboard-network

  # ----------------------------------------------------------------------------
  # Redis Cache & Background Queue
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # REDIS_PASSWORD comes from .secrets/stack.env; the container's shell reads it ($$ = not a Compose ${...}).
    env_file:
      - path: ./.secrets/stack.env
        required: true
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$${REDIS_PASSWORD:?REDIS_PASSWORD is not set in .secrets/stack.env}\""]
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shiftboard-network

  # ----------------------------------------------------------------------------
  # Backend API (Python / FastAPI)
  #
  # The background worker runs INSIDE this container: the FastAPI lifespan in
  # backend/src/main.py starts it with asyncio.create_task() (no separate service).
  # Every minute it sends reminders and alerts, runs cover requests and waitlists,
  # auto clocks-out, and delivers email / text / push. A Redis lock makes sure only
  # one process runs each tick. Health: Admin -> System -> Background worker.
  # Set NOTIFICATIONS_WORKER_ENABLED=false (in .env) only if you
  # add extra API replicas that should not run it.
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
      - path: ./.secrets/stack.env
        required: true
      - path: ./.secrets/integrations.env
        required: true
    # These win over the files: how the backend reaches the other containers (always 5432 / 6379
    # inside the Docker network; POSTGRES_PORT / REDIS_PORT in .env are only the ports on your computer).
    # backend/src/config.py builds the database and Redis addresses from these + the passwords.
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
    volumes:
      - ./backend:/app
      - ./.secrets:/app/secrets:ro
    ports:
      - "${PORT_BACKEND:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shiftboard-network

  # ----------------------------------------------------------------------------
  # Frontend PWA (Vite Dev Server with Hot-Reloading)
  # Needs no settings: the app calls /api on its own address (vite.config.js forwards it to
  # backend:8000) and gets the Firebase web config from the backend at runtime.
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Two ports on your computer reach the same Vite server (5173 inside the container).
    ports:
      - "${PORT_FRONTEND_VITE:-5173}:5173"
      - "${PORT_FRONTEND:-80}:5173"
    depends_on:
      - backend
    # "shiftboard-frontend" was this container's fixed name before Phase 35.4. It stays as a name
    # on this stack's own network, so a Cloudflare tunnel that points at
    # http://shiftboard-frontend:5173 keeps working. Each stack has its own network, so the
    # same name in two stacks doesn't clash.
    networks:
      shiftboard-network:
        aliases:
          - shiftboard-frontend

  # ----------------------------------------------------------------------------
  # Cloudflare Tunnel (Zero-Trust Inbound Ingress)
  # ----------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # cloudflared reads TUNNEL_TOKEN from .secrets/stack.env by itself.
    env_file:
      - path: ./.secrets/stack.env
        required: true
    command: tunnel --no-autoupdate run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./.secrets:/etc/cloudflared/secrets:ro
    depends_on:
      - frontend
    networks:
      - shiftboard-network

networks:
  shiftboard-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
